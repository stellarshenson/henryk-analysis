name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint - ruff format
        run: uv run ruff format --check

      - name: Lint - ruff check
        run: uv run ruff check

      - name: Run tests
        run: uv run pytest --cov=henryk_analysis -v ./tests

      - name: Build wheel
        run: uv run python -m build --wheel

      - name: Smoke-import built package
        run: uv run python -c "import henryk_analysis; print(henryk_analysis.__version__)"
