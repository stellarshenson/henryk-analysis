[build-system]
requires = [
    "setuptools",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "lib_henryk"
version = "0.3"
description="Henryk content creation and analysis"
authors = [
    {name = "Konrad Jelen <konrad.jelen@gmail.com>"},
]
license = {text = ""}

requires-python = ">=3.10"
dependencies = [
    'ffmpeg-binaries',
    'json_repair',
    'markdown-it-py',
    'matplotlib',
    'mdit_plain',
    'names_generator',
    'numpy',
    'openai',
    'pandas',
    'plotly',
    'polars',
    'pydub',
    'python-docx',
    'python-dotenv',
    'scikit-learn',
    'seaborn',
    'transformers',
    'wordcloud',
]

[tool.setuptools]
include-package-data = true # default value

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests"]
namespaces = true # default value is true

# EOF
