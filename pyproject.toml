[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lib_henryk_analysis"
version = "0.1.0"
description = "Project dedicated to the analysis and processing of various content related to my son and him being alienaded from me (his father). This is a Hope project, to help me win my son back and help us maintain connection"
authors = [
    { name = "Konrad Jelen" },
]
license = "MIT"
readme = "README.md"
requires-python = "~=3.12.0"
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    # core
    "colorama",
    "loguru",
    "typer",
    "python-dotenv",
    # data processing
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    # audio metadata (pure Python)
    "mutagen",
    # AI/NLP
    "openai",
    "transformers",
    "json_repair",
    # visualization
    "matplotlib",
    "seaborn",
    "plotly",
    "wordcloud",
    # documents
    "python-docx",
    "markdown-it-py",
    "mdit_plain",
    # ML
    "scikit-learn",
    # utilities
    "names_generator",
    "ipywidgets",
    "IProgress",
    "rich",
]

[project.optional-dependencies]
dev = [
    "build",
    "click",
    "ipykernel",
    "ipython<9",
    "nbdime",
    "pip",
    "mkdocs",
    "pytest",
    "pytest-cov",
    "ruff",
    "toml",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["lib_henryk_analysis*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 99
src = ["lib_henryk_analysis"]
include = ["pyproject.toml", "lib_henryk_analysis/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["lib_henryk_analysis"]
force-sort-within-sections = true
